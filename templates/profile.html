{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}
<section class="page-hero"><div class="site-container container-fluid"><span class="eyebrow">MEMBERSHIP REGISTRY</span><h1>Your information.<br><em>Your community.</em></h1></div></section>
<section class="inner-section"><div class="site-container container-fluid"><div class="row"><div class="col-lg-7"><div class="form-panel"><h2>Update your profile</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-12"><label class="form-label">Name</label><input required class="form-control" name="name" maxlength="140" value="{{ current_user.name }}"></div><div class="col-12"><label class="form-label">Email (unchangeable)</label><input disabled class="form-control" value="{{ current_user.email }}"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ current_user.phone or '' }}"></div><div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" value="{{ current_user.city or '' }}"></div><div class="col-12"><label class="form-label">Country</label><input class="form-control" name="country" value="{{ current_user.country or '' }}"></div><div class="col-12"><label class="form-label">About you</label><textarea class="form-control" rows="5" maxlength="2000" name="bio">{{ current_user.bio or '' }}</textarea></div><div class="col-12"><button class="btn btn-copper" type="submit">Save Profile</button> <a class="btn btn-outline-custom" href="{{ url_for('member_dashboard') }}">Back to Portal</a></div></div></form></div></div></div></div></section>{% endblock %}
